<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d0d13">
<meta name="format-detection" content="telephone=no,date=no,address=no,email=no">
<title>Кузница</title>
<!-- VK Play JS API: GMRID is auto-detected when possible, or can be set via window.VKPLAY_GMRID. -->
<script src="js/vkplay.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overscroll-behavior:none;overflow:hidden}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
  body{
    font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,sans-serif;
    background:radial-gradient(1200px 800px at 50% -10%, #2a2a3a 0%, #1a1a24 45%, #0d0d13 100%);
    color:#e8e8ef;min-height:100vh;min-height:calc(var(--vh, 1vh) * 100);min-height:100dvh;display:flex;justify-content:center;
    padding:max(16px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right) + 12px)
      max(24px, env(safe-area-inset-bottom) + 12px) max(12px, env(safe-area-inset-left) + 12px);
    overflow-x:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
    -webkit-user-drag:none;-webkit-tap-highlight-color:transparent;font-size:14px;
    touch-action:manipulation;overflow:hidden;
  }
  body::before{
    content:'';position:fixed;inset:0;
    background-image:
      radial-gradient(2px 2px at 20% 30%, rgba(255,255,255,.06) 0, transparent 100%),
      radial-gradient(1px 1px at 80% 15%, rgba(255,255,255,.05) 0, transparent 100%),
      radial-gradient(1.5px 1.5px at 60% 70%, rgba(255,255,255,.04) 0, transparent 100%),
      radial-gradient(1px 1px at 10% 80%, rgba(255,255,255,.05) 0, transparent 100%);
    pointer-events:none;z-index:0;animation:starField 60s linear infinite;
  }
  @keyframes starField{0%{background-position:0 0,0 0,0 0,0 0}100%{background-position:0 60px,0 80px,0 50px,0 70px}}
  body.frenzy::after{
    content:'';position:fixed;inset:0;pointer-events:none;z-index:9000;
    background:radial-gradient(ellipse at 50% 50%, rgba(255,140,40,.08), transparent 60%);
    box-shadow:inset 0 0 120px rgba(255,160,40,.18);
    animation:frenzyPulse 1.4s ease-in-out infinite;
  }
  @keyframes frenzyPulse{0%,100%{opacity:.6}50%{opacity:1}}

  .app{position:relative;z-index:1;width:100%;max-width:1080px;display:flex;flex-direction:column;gap:10px}

  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;
    background:linear-gradient(180deg, rgba(40,40,56,.85), rgba(28,28,40,.85));
    border:1px solid #2e2e3d;border-radius:16px;
    box-shadow:0 8px 32px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.04);backdrop-filter:blur(8px)}
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .brand-icon{width:36px;height:36px;flex-shrink:0;filter:drop-shadow(0 0 10px rgba(168,106,216,.5));
    animation:brandPulse 3.5s ease-in-out infinite}
  @keyframes brandPulse{0%,100%{filter:drop-shadow(0 0 8px rgba(168,106,216,.4))}50%{filter:drop-shadow(0 0 16px rgba(168,106,216,.75))}}
  .brand-title{font-size:18px;font-weight:700;letter-spacing:.5px;
    background:linear-gradient(180deg,#fff,#b9b9d0);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.1}
  .brand-sub{font-size:10px;color:#7a7a95;letter-spacing:2px;text-transform:uppercase;margin-top:2px}
  .stats{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .stat{display:flex;align-items:center;gap:8px;
    background:linear-gradient(180deg, rgba(20,20,30,.7), rgba(30,30,44,.7));
    border:1px solid #2e2e3d;border-radius:12px;padding:6px 12px 6px 8px;min-width:96px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.03)}
  .stat-icon{width:22px;height:22px;flex-shrink:0}
  .stat-value{font-size:15px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;color:#fff}
  .stat-value.gold{color:#ffd070}
  .stat-value.lvl{color:#a4d4f6}
  .stat-label{font-size:9px;color:#7a7a95;letter-spacing:1px;text-transform:uppercase;margin-top:3px}
  .menu-btn{width:38px;height:38px;flex-shrink:0;background:linear-gradient(180deg,#26263a,#1c1c2a);
    border:1px solid #30304a;border-radius:10px;cursor:pointer;display:flex;align-items:center;
    justify-content:center;transition:all .15s ease;position:relative}
  .menu-btn:hover{border-color:#4a4a70;background:linear-gradient(180deg,#2d2d44,#202032)}
  .menu-btn:active{transform:scale(.95)}
  .menu-btn svg{width:22px;height:22px}
  .menu-btn .badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;
    background:linear-gradient(180deg,#ff8a3a,#c44800);border-radius:9px;
    font-size:10px;font-weight:800;color:#fff;display:flex;align-items:center;justify-content:center;
    padding:0 5px;border:2px solid #1a1a24;box-shadow:0 2px 8px rgba(255,120,20,.5)}
  .menu-btn .badge:empty{display:none}

  .xpwrap{padding:0 6px;margin-top:-2px}
  .xpbar{height:5px;background:#16161f;border:1px solid #2a2a38;border-radius:6px;overflow:hidden;position:relative}
  .xpfill{height:100%;width:0%;background:linear-gradient(90deg,#5a90c8,#a4d4f6);border-radius:5px;
    transition:width .4s cubic-bezier(.2,.8,.3,1);box-shadow:0 0 12px rgba(164,212,246,.5)}

  main{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:12px;align-items:start}
  @media (max-width:880px){main{grid-template-columns:1fr}}
  /* Touch devices: give the merge board the full available width so items are easier to drag. */
  @media (pointer:coarse) and (hover:none) and (max-width:1200px){
    main{grid-template-columns:1fr;gap:10px}
    .board-col{width:100%}
    .grid{width:100%;max-width:none;gap:7px;padding:9px}
    .cell{border-radius:10px}
    .item-wrap{inset:5%}
  }
  .board-col{display:flex;flex-direction:column;gap:10px;min-width:0;position:relative}

  .combo-badge{position:absolute;top:-10px;left:50%;transform:translateX(-50%) scale(.5);
    padding:5px 16px;background:linear-gradient(180deg,#ff8a3a,#c44800);
    border:2px solid #ffeaa8;border-radius:20px;font-weight:800;font-size:14px;
    color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.5);opacity:0;pointer-events:none;
    transition:opacity .2s ease, transform .2s ease;z-index:5;
    box-shadow:0 4px 20px rgba(255,120,20,.5);font-variant-numeric:tabular-nums;letter-spacing:.5px}
  .combo-badge.show{opacity:1;transform:translateX(-50%) scale(1)}
  .combo-badge.bump{animation:comboPulse .3s cubic-bezier(.34,1.56,.64,1)}
  @keyframes comboPulse{0%{transform:translateX(-50%) scale(.7)}60%{transform:translateX(-50%) scale(1.18)}100%{transform:translateX(-50%) scale(1)}}

  .frenzy-badge{position:absolute;top:-10px;right:14px;padding:5px 14px;
    background:linear-gradient(180deg,#ff5a1a,#a02000);
    border:2px solid #ffeaa8;border-radius:20px;font-weight:800;font-size:13px;
    color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.5);opacity:0;pointer-events:none;
    transition:opacity .25s ease;z-index:5;
    box-shadow:0 4px 24px rgba(255,80,20,.6);font-variant-numeric:tabular-nums;
    display:flex;align-items:center;gap:6px}
  .frenzy-badge.show{opacity:1;animation:frenzyShake .8s ease-in-out infinite}
  .frenzy-badge svg{width:16px;height:16px}
  @keyframes frenzyShake{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}

  .grid{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;padding:10px;
    background:radial-gradient(600px 400px at 50% 0%, rgba(60,60,90,.35), transparent 70%),
      linear-gradient(160deg,#1d1d29,#141420);
    border:1px solid #2a2a38;border-radius:16px;aspect-ratio:1/1;width:100%;
    box-shadow:inset 0 2px 24px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.03), 0 12px 40px rgba(0,0,0,.4);
    transition:box-shadow .3s ease}
  body.frenzy .grid{box-shadow:inset 0 2px 24px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.03),
    0 12px 40px rgba(0,0,0,.4), 0 0 60px rgba(255,140,40,.35)}
  .cell{position:relative;background:linear-gradient(180deg,#23232f,#1c1c28);border:1px solid #2c2c3a;
    border-radius:9px;aspect-ratio:1/1;touch-action:none;
    transition:background .18s ease, border-color .18s ease, box-shadow .18s ease;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.03);overflow:hidden}
  .cell::after{content:'';position:absolute;inset:0;border-radius:8px;
    box-shadow:inset 0 -6px 12px rgba(0,0,0,.25);pointer-events:none}
  .cell.has-item{background:linear-gradient(160deg,#2b2b3c,#1e1e2c);border-color:#3a3a4d}
  .cell.drop-target{background:linear-gradient(160deg,#343450,#252540);border-color:#f0b429;
    box-shadow:inset 0 0 16px rgba(240,180,41,.25), 0 0 0 1px rgba(240,180,41,.5), 0 0 20px rgba(240,180,41,.25)}
  .cell.drag-source .item-wrap{opacity:.18}

  .item-wrap{position:absolute;inset:8%;display:flex;align-items:center;justify-content:center;
    pointer-events:none;transition:opacity .15s}
  .item-svg{width:100%;height:100%;display:block;filter:drop-shadow(0 3px 5px rgba(0,0,0,.45))}
  .item-wrap.lvl-5{filter:drop-shadow(0 0 8px rgba(220,180,80,.5))}
  .item-wrap.lvl-6{filter:drop-shadow(0 0 9px rgba(255,200,80,.55))}
  .item-wrap.lvl-7{filter:drop-shadow(0 0 10px rgba(120,220,255,.6))}
  .item-wrap.lvl-8{filter:drop-shadow(0 0 11px rgba(120,200,255,.65))}
  .item-wrap.lvl-9{filter:drop-shadow(0 0 13px rgba(255,120,220,.7));animation:mythicGlow 2.6s ease-in-out infinite}
  .item-wrap.lvl-10{filter:drop-shadow(0 0 16px rgba(255,220,120,.85));animation:divineGlow 2.2s ease-in-out infinite}
  @keyframes mythicGlow{0%,100%{filter:drop-shadow(0 0 8px rgba(255,120,220,.55))}50%{filter:drop-shadow(0 0 18px rgba(255,160,240,.95))}}
  @keyframes divineGlow{0%,100%{filter:drop-shadow(0 0 10px rgba(255,220,120,.7))}50%{filter:drop-shadow(0 0 24px rgba(255,240,160,1))}}
  .item-wrap.golden .item-svg{
    filter:sepia(.85) saturate(3) hue-rotate(-12deg) brightness(1.22) drop-shadow(0 0 10px rgba(255,200,60,.9));
  }
  .item-wrap.golden::before{
    content:'';position:absolute;inset:-6%;
    background:radial-gradient(circle at 50% 50%, rgba(255,220,100,.35), transparent 65%);
    border-radius:50%;pointer-events:none;animation:goldenPulse 1.8s ease-in-out infinite;
  }
  @keyframes goldenPulse{0%,100%{opacity:.55}50%{opacity:1}}
  .item-wrap.spawn{animation:popIn .38s cubic-bezier(.34,1.56,.64,1)}
  @keyframes popIn{0%{transform:scale(.2);opacity:0}60%{transform:scale(1.12);opacity:1}100%{transform:scale(1);opacity:1}}
  .item-wrap.merged{animation:mergePop .42s cubic-bezier(.34,1.56,.64,1)}
  @keyframes mergePop{0%{transform:scale(.65)}50%{transform:scale(1.22)}100%{transform:scale(1)}}

  .toolbar{display:flex;gap:8px}
  .tool-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;
    padding:10px 8px;background:linear-gradient(180deg,#26263a,#1c1c2a);
    border:1px solid #30304a;border-radius:12px;color:#c8c8d8;font-family:inherit;
    font-size:12px;font-weight:600;letter-spacing:.4px;cursor:pointer;transition:all .15s ease;
    text-transform:uppercase}
  .tool-btn:hover{border-color:#4a4a70;background:linear-gradient(180deg,#2d2d44,#202032);color:#fff}
  .tool-btn:active{transform:scale(.97)}
  .tool-btn svg{width:18px;height:18px}
  .tool-btn.active{background:linear-gradient(180deg,#3a2a1a,#2a1a0a);border-color:#f0b429;color:#ffd070;
    box-shadow:0 0 20px rgba(240,180,41,.25), inset 0 0 12px rgba(240,180,41,.1)}
  .tool-btn:disabled{opacity:.4;cursor:not-allowed}

  .sell-bar{display:flex;align-items:center;gap:12px;padding:11px 16px;
    background:linear-gradient(180deg, rgba(40,30,20,.55), rgba(28,22,16,.55));
    border:1px dashed #4a3a24;border-radius:14px;color:#a08a68;font-size:12.5px;
    transition:all .2s ease;min-height:52px}
  .sell-bar.sell-target{background:linear-gradient(180deg, rgba(90,60,20,.75), rgba(60,40,14,.75));
    border-color:#f0b429;color:#ffd070;box-shadow:0 0 24px rgba(240,180,41,.25), inset 0 0 20px rgba(240,180,41,.1)}
  .sell-icon{width:24px;height:24px;flex-shrink:0;opacity:.85}

  .side{display:flex;flex-direction:column;gap:12px;min-width:0}
  .panel{background:linear-gradient(180deg, rgba(36,36,52,.85), rgba(24,24,36,.85));
    border:1px solid #2a2a38;border-radius:16px;padding:13px;
    box-shadow:0 8px 30px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.03)}
  .panel-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px;gap:8px}
  .panel h3{font-size:12.5px;font-weight:600;letter-spacing:1.6px;text-transform:uppercase;color:#a8a8c8}
  .hint{font-size:10.5px;color:#666680;letter-spacing:.3px}
  .slots{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
  .w-slot{position:relative;aspect-ratio:1/1;border-radius:10px;
    background:linear-gradient(180deg,#1b1b26,#15151e);border:1px dashed #33334a;
    transition:all .18s ease;touch-action:none;overflow:hidden}
  .w-slot.unlocked{border-style:solid;border-color:#3a3a52;background:linear-gradient(160deg,#2b2b3c,#1e1e2c)}
  .w-slot.locked{opacity:.45;cursor:not-allowed}
  .w-slot.locked::before{content:'';position:absolute;inset:0;
    background:repeating-linear-gradient(45deg, rgba(255,255,255,.02) 0 6px, transparent 6px 12px);pointer-events:none}
  .w-slot.drop-target{border-color:#f0b429;box-shadow:0 0 0 1px rgba(240,180,41,.5), 0 0 18px rgba(240,180,41,.25)}
  .w-slot .item-wrap{inset:12%}
  .w-slot .item-svg{filter:drop-shadow(0 0 8px rgba(168,106,216,.7))}

  .shop{display:flex;flex-direction:column;gap:7px}
  .shop-btn{display:flex;align-items:center;gap:10px;padding:9px 11px;
    background:linear-gradient(180deg,#26263a,#1c1c2a);border:1px solid #30304a;border-radius:12px;
    color:#e8e8ef;font-family:inherit;font-size:12.5px;cursor:pointer;text-align:left;
    transition:all .15s ease;position:relative;overflow:hidden}
  .shop-btn:hover:not(:disabled){border-color:#4a4a70;background:linear-gradient(180deg,#2d2d44,#202032);transform:translateY(-1px)}
  .shop-btn:active:not(:disabled){transform:translateY(0)}
  .shop-btn:disabled{opacity:.45;cursor:not-allowed;filter:grayscale(.5)}
  .shop-btn-icon{width:30px;height:30px;flex-shrink:0;filter:drop-shadow(0 2px 4px rgba(0,0,0,.4))}
  .shop-btn-text{flex:1;min-width:0}
  .shop-btn-title{font-weight:600;font-size:12.5px;letter-spacing:.2px}
  .shop-btn-sub{font-size:10.5px;color:#8a8aa8;margin-top:2px}
  .shop-btn-cost{display:flex;align-items:center;gap:5px;font-weight:700;font-size:12.5px;
    color:#ffd070;font-variant-numeric:tabular-nums;flex-shrink:0}
  .shop-btn-cost svg{width:15px;height:15px}
  .shop-btn:not(.affordable) .shop-btn-cost{color:#a06060}

  .modal-back{position:fixed;inset:0;background:rgba(5,5,10,.72);backdrop-filter:blur(6px);
    z-index:10000;display:none;align-items:center;justify-content:center;
    padding:max(20px, calc(env(safe-area-inset-top) + 12px)) max(20px, env(safe-area-inset-right))
      max(20px, calc(env(safe-area-inset-bottom) + 12px)) max(20px, env(safe-area-inset-left));
    animation:fadeIn .2s ease}
  .modal-back.show{display:flex}
  @keyframes fadeIn{0%{opacity:0}100%{opacity:1}}
  .modal{background:linear-gradient(180deg,#22222f,#181824);
    border:1px solid #35354a;border-radius:20px;padding:22px;max-width:520px;width:100%;
    max-height:85vh;max-height:85dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;position:relative;
    box-shadow:0 24px 80px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.04);
    animation:modalIn .35s cubic-bezier(.34,1.4,.64,1)}
  @keyframes modalIn{0%{opacity:0;transform:scale(.92) translateY(10px)}100%{opacity:1;transform:scale(1) translateY(0)}}
  .modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:12px}
  .modal-title{font-size:18px;font-weight:700;letter-spacing:.5px;
    background:linear-gradient(180deg,#fff,#c8c8e0);-webkit-background-clip:text;background-clip:text;color:transparent;
    display:flex;align-items:center;gap:10px}
  .modal-title svg{width:26px;height:26px}
  .modal-close{width:32px;height:32px;background:rgba(255,255,255,.05);border:1px solid #35354a;
    border-radius:8px;cursor:pointer;color:#a8a8c8;font-size:18px;line-height:1;
    display:flex;align-items:center;justify-content:center;transition:all .15s ease}
  .modal-close:hover{background:rgba(255,255,255,.1);color:#fff}
  .modal-tabs{display:flex;gap:6px;margin-bottom:14px;padding:4px;background:#1a1a24;border-radius:12px;
    border:1px solid #2a2a38}
  .modal-tab{flex:1;padding:8px 12px;background:transparent;border:none;color:#8a8aa8;
    font-family:inherit;font-size:12px;font-weight:600;letter-spacing:.5px;cursor:pointer;
    border-radius:8px;transition:all .15s ease;text-transform:uppercase}
  .modal-tab:hover{color:#c8c8d8}
  .modal-tab.active{background:linear-gradient(180deg,#35354a,#28283a);color:#fff;
    box-shadow:0 2px 8px rgba(0,0,0,.3)}
  .tab-content{display:none}
  .tab-content.active{display:block;animation:fadeIn .25s ease}

  .ach-list{display:flex;flex-direction:column;gap:8px}
  .ach{display:flex;align-items:center;gap:12px;padding:10px 12px;
    background:linear-gradient(180deg, rgba(30,30,42,.7), rgba(22,22,32,.7));
    border:1px solid #2a2a38;border-radius:12px;transition:all .2s ease}
  .ach.unlocked{border-color:#4a7a5a;background:linear-gradient(180deg, rgba(30,50,40,.7), rgba(20,35,28,.7))}
  .ach-icon{width:38px;height:38px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    background:rgba(0,0,0,.25);border-radius:10px;color:#5a5a7a}
  .ach.unlocked .ach-icon{color:#ffd070;background:rgba(255,200,80,.1)}
  .ach-icon svg{width:24px;height:24px}
  .ach-text{flex:1;min-width:0}
  .ach-name{font-weight:600;font-size:13px;color:#c8c8d8}
  .ach.unlocked .ach-name{color:#fff}
  .ach-desc{font-size:11px;color:#7a7a95;margin-top:2px}
  .ach-state{font-size:11px;font-weight:700;color:#5a5a7a;letter-spacing:1px}
  .ach.unlocked .ach-state{color:#7adaa0}

  .stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
  .stat-card{padding:12px;background:linear-gradient(180deg, rgba(30,30,42,.7), rgba(22,22,32,.7));
    border:1px solid #2a2a38;border-radius:12px}
  .stat-card-lbl{font-size:10px;color:#7a7a95;letter-spacing:1.2px;text-transform:uppercase;margin-bottom:6px}
  .stat-card-val{font-size:17px;font-weight:700;color:#fff;font-variant-numeric:tabular-nums}

  .chest-wrap{text-align:center;padding:12px 0}
  .chest{width:140px;height:140px;margin:0 auto 16px;display:block;
    filter:drop-shadow(0 0 30px rgba(255,180,60,.6));
    animation:chestFloat 2.5s ease-in-out infinite}
  @keyframes chestFloat{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-10px) rotate(1deg)}}
  .chest.locked{filter:drop-shadow(0 0 20px rgba(120,120,160,.4)) grayscale(.5);animation:none;opacity:.7}
  .chest-info{font-size:14px;color:#c8c8d8;margin-bottom:8px}
  .chest-info b{color:#ffd070;font-size:20px;display:block;margin-top:6px}
  .chest-streak{display:flex;justify-content:center;gap:6px;margin:14px 0}
  .streak-dot{width:32px;height:32px;border-radius:50%;
    background:linear-gradient(180deg,#2a2a38,#1a1a24);border:1px solid #3a3a4d;
    display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#5a5a7a;
    transition:all .25s ease}
  .streak-dot.active{background:linear-gradient(180deg,#ffd070,#c88400);border-color:#ffeaa8;color:#3a2008;
    box-shadow:0 0 16px rgba(255,200,80,.5)}
  .streak-dot.today{transform:scale(1.15)}
  .primary-btn{width:100%;padding:14px;background:linear-gradient(180deg,#ffd070,#c88400);

<script>
/* Мобильные фиксы: блокировка pinch-zoom/двойного тапа и надёжная высота экрана
   (часть Android WebView и встроенных браузеров игнорирует user-scalable=no,
   а старые мобильные Safari/Chrome не поддерживают единицу dvh). */
(function(){
  document.addEventListener('gesturestart', function(e){ e.preventDefault(); }, { passive:false });
  var lastTouchEnd = 0;
  document.addEventListener('touchend', function(e){
    var now = Date.now();
    if(now - lastTouchEnd <= 300) e.preventDefault();
    lastTouchEnd = now;
  }, { passive:false });
  function setVH(){
    document.documentElement.style.setProperty('--vh', (window.innerHeight * 0.01) + 'px');
  }
  setVH();
  window.addEventListener('resize', setVH);
  window.addEventListener('orientationchange', setVH);
})();
</script>

let audioCtx = null;
function ensureAudio(){ if(!audioCtx){ try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ audioCtx = null; } } return audioCtx; }
function suspendAudio(){
  if(audioCtx && audioCtx.state === 'running') audioCtx.suspend().catch(()=>{});
}

}
function beep(freq, dur, type, vol){
  if(!state.soundOn) return; const ctx = ensureAudio(); if(!ctx) return;
  if(ctx.state === 'suspended') ctx.resume();
  const osc = ctx.createOscillator(); const g = ctx.createGain();
  osc.type = type || 'sine'; osc.frequency.setValueAtTime(freq, ctx.currentTime);
  g.gain.setValueAtTime(0, ctx.currentTime);
  g.gain.linearRampToValueAtTime(vol || 0.06, ctx.currentTime + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + dur);
  osc.connect(g); g.connect(ctx.destination); osc.start(); osc.stop(ctx.currentTime + dur + 0.02);
}

function fmt(n){
  n = Math.floor(n);
  if(n >= 1e9) return (n/1e9).toFixed(2)+'B';
  if(n >= 1e6) return (n/1e6).toFixed(2)+'M';
  if(n >= 1e4) return (n/1e3).toFixed(1)+'K';
  return n.toString();
}
function fmtTime(sec){
  sec = Math.max(0, Math.floor(sec));
  const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = sec%60;
  if(h) return t('timeHourMin', h, m);
  if(m) return t('timeMinSec', m, s);
  return t('timeSec', s);
}
function speedMult(){ return 1 + 0.30 * (state.speedLevel - 1); }
function levelBonus(){ return 1 + 0.02 * (state.level - 1); }

  const gap = now - d.lastClaim;

  d.lastClaim = now; setDaily(d);

function render(){

function getIncome(){

}
function renderShop(){

function buyGen(){ const c = genCost(); if(state.gold < c) return;
  state.gold -= c; state.genLevel++; sfxBuy(); render(); save(); checkAchievements(); }
function buySpeed(){ const c = speedCost(); if(state.gold < c) return;
  state.gold -= c; state.speedLevel++; sfxBuy(); render(); save(); checkAchievements(); }
function buySlot(){ if(state.slotsUnlocked >= MAX_SLOTS) return; const c = slotCost();
  if(state.gold < c) return; state.gold -= c; state.slotsUnlocked++; state.slotBought++;
  sfxBuy(); render(); save(); checkAchievements(); }

function spawnItem(){
  const empty = []; for(let i=0;i<GRID_SIZE;i++) if(!state.grid[i]) empty.push(i);
  if(empty.length === 0) return;
  const idx = empty[Math.floor(Math.random()*empty.length)];
  const frenzyBonus = isFrenzy() ? 2 : 1;
  const golden = Math.random() < (GOLDEN_CHANCE * frenzyBonus);
  let lvl = 1; const r = Math.random();
  if(r < 0.015) lvl = 3; else if(r < 0.09) lvl = 2;
  state.grid[idx] = { level: lvl, golden: golden }; state.spawnCount++;
  render();
  const cell = gridEl.children[idx]; const wrap = cell && cell.querySelector('.item-wrap');
  if(wrap){ wrap.classList.add('spawn'); wrap.addEventListener('animationend', () => wrap.classList.remove('spawn'), {once:true}); }
  if(golden) sfxGolden();
}
function bumpCombo(){
  const now = performance.now();
  if(now - state.lastMergeAt < COMBO_TIMEOUT) state.combo = Math.min(COMBO_MAX, state.combo + 1);
  else state.combo = 1;
  state.lastMergeAt = now;
  if(state.combo > state.maxCombo) state.maxCombo = state.combo;
  if(state.combo >= 2){
    comboEl.classList.add('show'); comboEl.classList.remove('bump');
    void comboEl.offsetWidth; comboEl.classList.add('bump');
    comboEl.textContent = 'COMBO ×' + state.combo;
  }
}
function tickCombo(){
  if(state.combo > 0 && performance.now() - state.lastMergeAt > COMBO_TIMEOUT){
    state.combo = 0; comboEl.classList.remove('show');
  }
}
function addXP(n){
  const bonus = 1 + state.combo * 0.1; state.xp += n * bonus;
  let leveled = false;
  while(state.xp >= xpNeeded()){
    state.xp -= xpNeeded(); state.level++;
    const reward = 40 * state.level; state.gold += reward; state.totalEarned += reward; leveled = true;
  }
  if(leveled){
    notify(t('levelUp', state.level, 40 * state.level), 'gold');
    sfxLevelup(); spawnParticles(window.innerWidth/2, 120, '#a4d4f6', 18);
    checkAchievements();
  }
}

function getItem(src){ if(src.type === 'grid') return state.grid[src.idx]; if(src.type === 'workshop') return state.workshop[src.idx]; return null; }
function setItem(src, val){ if(src.type === 'grid') state.grid[src.idx] = val; else if(src.type === 'workshop') state.workshop[src.idx] = val; }
function elFor(src){ if(src.type === 'grid') return gridEl.children[src.idx]; if(src.type === 'workshop') return workshopEl.children[src.idx]; return null; }
function cellCenter(src){ const el = elFor(src); if(!el) return {x:window.innerWidth/2, y:window.innerHeight/2};
  const r = el.getBoundingClientRect(); return {x:r.left + r.width/2, y:r.top + r.height/2}; }
function canDropOn(from, to){
  if(from.type === to.type && from.idx === to.idx) return false;
  const item = getItem(from); if(!item) return false;
  const target = getItem(to);
  if(to.type === 'workshop'){ if(to.idx >= state.slotsUnlocked) return false; if(item.level < 5) return false; return true; }
  if(to.type === 'grid'){ if(!target) return true; return target.level === item.level && item.level < MAX; }
  return false;
}

let drag = null;
function onPointerDown(e){
  if(e.button !== undefined && e.button !== 0) return;
  const cellEl = e.target.closest && e.target.closest('[data-cell]');
  const slotEl = e.target.closest && e.target.closest('[data-slot]');
  let src = null, srcEl = null;
  if(cellEl){ src = { type:'grid', idx:+cellEl.dataset.cell }; srcEl = cellEl; }
  else if(slotEl){ src = { type:'workshop', idx:+slotEl.dataset.slot }; srcEl = slotEl; }
  else return;
  const item = getItem(src); if(!item) return;
  e.preventDefault();
  const rect = srcEl.getBoundingClientRect();
  const ghost = document.createElement('div'); ghost.className = 'drag-ghost';
  ghost.style.width = rect.width + 'px'; ghost.style.height = rect.height + 'px';
  ghost.innerHTML = iconSVG(LEVELS[item.level].icon);
  if(item.golden) ghost.firstChild.style.filter = 'sepia(.85) saturate(3) hue-rotate(-12deg) brightness(1.22) drop-shadow(0 0 10px rgba(255,200,60,.9))';
  document.body.appendChild(ghost);
  drag = { source: src, item: item, ghost: ghost,
    offsetX: e.clientX - rect.left, offsetY: e.clientY - rect.top,
    startX: e.clientX, startY: e.clientY, startTime: performance.now(), srcEl: srcEl };
  srcEl.classList.add('drag-source'); updateGhost(e.clientX, e.clientY);
  window.addEventListener('pointermove', onPointerMove);
  window.addEventListener('pointerup', onPointerUp);
  window.addEventListener('pointercancel', onPointerUp);
}
function updateGhost(x, y){ if(!drag) return;
  drag.ghost.style.left = (x - drag.offsetX) + 'px'; drag.ghost.style.top = (y - drag.offsetY) + 'px'; }
function onPointerMove(e){
  if(!drag) return; updateGhost(e.clientX, e.clientY);
  document.querySelectorAll('.drop-target, .sell-target').forEach(el => { el.classList.remove('drop-target'); el.classList.remove('sell-target'); });
  const el = document.elementFromPoint(e.clientX, e.clientY); if(!el) return;
  if(el.closest && el.closest('#sellBar')){ sellBarEl.classList.add('sell-target'); return; }
  const cellEl = el.closest('[data-cell]'); const slotEl = el.closest('[data-slot]');
  if(cellEl){ const idx = +cellEl.dataset.cell; if(canDropOn(drag.source, { type:'grid', idx })) cellEl.classList.add('drop-target'); }
  else if(slotEl){ const idx = +slotEl.dataset.slot; if(canDropOn(drag.source, { type:'workshop', idx })) slotEl.classList.add('drop-target'); }
}
function onPointerUp(e){
  window.removeEventListener('pointermove', onPointerMove);
  window.removeEventListener('pointerup', onPointerUp);
  window.removeEventListener('pointercancel', onPointerUp);
  if(!drag) return;
  const d = drag; drag = null;
  const dist = Math.hypot(e.clientX - d.startX, e.clientY - d.startY);
  const elapsed = performance.now() - d.startTime;
  d.ghost.remove();
  document.querySelectorAll('.drop-target, .sell-target').forEach(el => { el.classList.remove('drop-target'); el.classList.remove('sell-target'); });
  if(d.srcEl) d.srcEl.classList.remove('drag-source');
  if(dist < 8 && elapsed < 300){
    const el = elFor(d.source);
    if(el) el.animate([{transform:'translateX(0)'},{transform:'translateX(-2px)'},{transform:'translateX(2px)'},{transform:'translateX(0)'}], {duration:180});
    render(); return;
  }
  const el = document.elementFromPoint(e.clientX, e.clientY); if(!el){ render(); return; }
  if(el.closest('#sellBar')){ sellItem(d.source); return; }
  const cellEl = el.closest('[data-cell]'); const slotEl = el.closest('[data-slot]');
  if(cellEl) tryDrop(d.source, { type:'grid', idx:+cellEl.dataset.cell });
  else if(slotEl) tryDrop(d.source, { type:'workshop', idx:+slotEl.dataset.slot });
  else render();
}
function tryDrop(from, to){
  if(!canDropOn(from, to)){ render(); return; }
  const item = getItem(from);
  if(to.type === 'workshop'){
    const existing = state.workshop[to.idx];
    state.workshop[to.idx] = item; setItem(from, existing || null);
    const c = cellCenter(to); burstRing(c.x, c.y, 'purple'); spawnParticles(c.x, c.y, '#a86ad8', 12);
    render(); animateMerge(elFor(to));
    let full = true; for(let i=0;i<state.slotsUnlocked;i++) if(!state.workshop[i]) full = false;
    if(full && state.workshopFullAtLeast < 1) state.workshopFullAtLeast = 1;
    save(); checkAchievements(); return;
  }
  const target = state.grid[to.idx];
  if(!target){ state.grid[to.idx] = item; setItem(from, null); render(); save(); return; }
  if(target.level === item.level && item.level < MAX){
    const newLevel = item.level + 1;
    const resultGolden = item.golden && target.golden;
    setItem(from, null); state.grid[to.idx] = { level:newLevel, golden: resultGolden };
    state.totalMerges++; if(newLevel > state.maxLevelEver) state.maxLevelEver = newLevel;
    const c = cellCenter(to);
    const ringCls = newLevel >= 9 ? 'gold' : newLevel >= 7 ? 'pink' : newLevel >= 5 ? 'purple' : newLevel >= 3 ? 'blue' : null;
    burstRing(c.x, c.y, ringCls);
    const pcolor = newLevel >= 9 ? '#ffe070' : newLevel >= 7 ? '#ff8ae0' : newLevel >= 5 ? '#c08cff' : '#f0b429';
    spawnParticles(c.x, c.y, pcolor, 8 + newLevel);
    sfxMerge(newLevel); bumpCombo(); addXP(6 + item.level * 4);
    if(resultGolden && newLevel >= 5){ notify(t('goldenItem', itemName(newLevel)), 'gold'); sfxGolden(); }
    render(); animateMerge(elFor(to)); checkAchievements(); save();
  } else render();
}
function animateMerge(el){
  if(!el) return; const wrap = el.querySelector('.item-wrap'); if(!wrap) return;
  wrap.classList.add('merged'); wrap.addEventListener('animationend', ()=>wrap.classList.remove('merged'), {once:true});
}
function sellItem(src){
  const item = getItem(src); if(!item) return;
  const value = itemSellValue(item); state.gold += value; state.totalEarned += value;
  if(item.golden) state.goldenSold++;
  setItem(src, null);
  const c = cellCenter(src); const color = item.golden ? '#ffe070' : '#ffd070';
  floatingText(c.x, c.y, '+' + fmt(value) + (item.golden ? ' ×8' : ''), color);
  burstRing(c.x, c.y, item.golden ? 'gold' : null);
  spawnParticles(c.x, c.y, color, item.golden ? 14 : 8);
  sfxSell(); render(); save(); checkAchievements();
}
gridEl.addEventListener('pointerdown', onPointerDown);
workshopEl.addEventListener('pointerdown', onPointerDown);

let autoMergeAcc = 0;
function doAutoMergeOnce(){
  for(let lvl=1; lvl<MAX; lvl++){
    let first = -1;
    for(let i=0;i<GRID_SIZE;i++){
      const it = state.grid[i];
      if(it && it.level === lvl && !it.golden){
        if(first === -1) first = i;
        else {
          const newLevel = lvl + 1;
          state.grid[first] = { level:newLevel, golden:false };
          state.grid[i] = null; state.totalMerges++;
          if(newLevel > state.maxLevelEver) state.maxLevelEver = newLevel;
          const c = cellCenter({ type:'grid', idx:first });
          burstRing(c.x, c.y, newLevel >= 5 ? 'purple' : 'blue');
          spawnParticles(c.x, c.y, newLevel >= 5 ? '#c08cff' : '#5ac8e8', 6);
          sfxMerge(newLevel); addXP(4 + lvl * 3);
          render(); checkAchievements(); return true;
        }
      }
    }
  }
  return false;
}
function autoMergeTick(dt){
  if(!state.autoMergeOn) return;
  autoMergeAcc += dt;
  if(autoMergeAcc >= AUTO_MERGE_INTERVAL){ autoMergeAcc = 0; if(doAutoMergeOnce()) save(); }
}

function idleTick(dt){

let spawnTimer = 0;
function genTick(dt){
  spawnTimer += dt * 1000; const interval = genInterval();
  while(spawnTimer >= interval){ spawnTimer -= interval; spawnItem(); }
}
let periodicCheckAcc = 0;
let autosaveAcc = 0;
function periodicTick(dt){
  periodicCheckAcc += dt;
  if(periodicCheckAcc >= 1){
    periodicCheckAcc -= 1;
    updateMenuBadge();
    if(!isFrenzy() && Math.random() < 0.012) activateFrenzy();
  }
  autosaveAcc += dt;
  if(autosaveAcc >= 20){
    autosaveAcc = 0;
    save();
  }

/* ==========================================================================
   Игровой цикл
   ========================================================================== */
let lastFrameTime = performance.now();
function gameLoop(now){
  const dt = Math.min(0.25, Math.max(0, (now - lastFrameTime) / 1000));
  lastFrameTime = now;
  genTick(dt);
  idleTick(dt);
  autoMergeTick(dt);
  tickCombo();
  tickFrenzy();
  periodicTick(dt);
  updateTopbar();
  requestAnimationFrame(gameLoop);
}

/* ==========================================================================
   Инициализация
   ========================================================================== */
function applyLang(lang){
  LANG = STRINGS[lang] ? lang : 'ru';
  T = STRINGS[LANG];
  document.documentElement.lang = LANG;
  applyStaticTranslations();
  render();
}

async function init(){
  buildGrid();
  buildWorkshop();

  let usedVKPlay = false;
  let hadSave = false;

  if(window.PMG && window.PMG.vkplay){
    try {
      await window.PMG.vkplay.init();
      usedVKPlay = window.PMG.vkplay.isInitialized();
      const lang = (window.PMG.i18n && window.PMG.i18n.lang) || 'ru';
      if(usedVKPlay && STRINGS[lang]) { LANG = lang; T = STRINGS[LANG]; }
    } catch(e){ usedVKPlay = false; }
  }

  hadSave = load();

  if(hadSave){
    applyOffline();
  } else {
    for(let i=0;i<6;i++) spawnItem();
  }

  applyStaticTranslations();
  render();
  updateMenuBadge();

  // VK Play does not use VK Play LoadingAPI/GameplayAPI calls.
  // Start the platform gameplay state only when the first playable UI is ready.
  if(usedVKPlay && window.PMG && window.PMG.vkplay){
    window.PMG.vkplay.gameReady();
    window.PMG.vkplay.gameplayStart();
  }

  lastFrameTime = performance.now();
  requestAnimationFrame(gameLoop);

  window.addEventListener('beforeunload', () => save());
  window.addEventListener('pagehide', () => save());
  document.addEventListener('visibilitychange', () => {
    if(document.visibilityState === 'hidden'){
      save();
      if(window.PMG && window.PMG.vkplay) window.PMG.vkplay.gameplayStop();
      suspendAudio();
    } else {
      if(window.PMG && window.PMG.vkplay) window.PMG.vkplay.gameplayStart();
      resumeAudio();
    }
  });
  window.addEventListener('blur', suspendAudio);
  window.addEventListener('focus', resumeAudio);

  if(!usedVKPlay){
    try {
      const lang = await detectLanguage();
      applyLang(lang);
    } catch(e){ /* остаёмся на русском по умолчанию */ }
  }
}

init();
})();
</script>
